<style>
/* One full-screen game canvas; under it, until the office is ready, the loading screen (Kaan): the
   painting of the bar, the game's name at the top left, gold that glints, a cigar that glows. */
:root {
	--room: #1c130d;
	--panel: #2a1d14;
	--mustard: #e0a93b;
	--cream: #efe6cf;
	--rust: #c4562a;
	--display: "Fraunces", Georgia, serif;
	--typed: "Special Elite", "Courier New", monospace;
	color-scheme: dark;
}
html, body { height: 100%; }
/* the page itself never moves: no rubber-band scrolling, and Safari can't shift it when the keyboard opens */
html { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; }
body {
	position: fixed;
	inset: 0;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	margin: 0;
	background: var(--room);
	color: var(--cream);
	overflow: hidden;
	touch-action: none;
	font-family: var(--typed);
}
#canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
/* Godot types through a hidden text box; under 16px Safari zooms the whole page in on it (Kaan's iPhone) */
input, textarea { font-size: 16px !important; -webkit-user-select: text; user-select: text; }
#status { position: fixed; inset: 0; overflow: hidden; background: var(--room); }

/* the painting covers the screen; every effect is placed in % of the painting, so it stays on its spot */
#art {
	--h: max(100vh, 66.6667vw);
	position: absolute; left: 50%;
	width: max(100vw, 150vh); height: var(--h);
	top: clamp(calc(100vh - var(--h)), calc(50vh - 0.42 * var(--h)), 0px);   /* a little more of the top (the glass) than the bottom */
	transform: translateX(-50%);
}
#art img { display: block; width: 100%; height: 100%; }
.fx { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); pointer-events: none; }

/* glints on the gold: a four-pointed star that flashes and turns */
.spark { width: calc(var(--s, 1) * 2.4%); aspect-ratio: 1; opacity: 0; animation: glint var(--t, 3.4s) ease-in-out var(--d, 0s) infinite; }
.spark::before, .spark::after {
	content: ""; position: absolute; inset: 0;
	background: radial-gradient(closest-side, #fff 0, #fff6d8 22%, rgba(255, 214, 120, 0.85) 45%, rgba(255, 190, 80, 0) 100%);
	clip-path: polygon(50% 0, 55% 45%, 100% 50%, 55% 55%, 50% 100%, 45% 55%, 0 50%, 45% 45%);
}
.spark::after { transform: rotate(45deg) scale(0.55); }
@keyframes glint {
	0%, 62%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(0deg); }
	74% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(40deg); }
	86% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.55) rotate(80deg); }
}

/* lamps and the chandelier breathe a warm light */
.glow {
	width: calc(var(--s, 1) * 9%); aspect-ratio: 1; border-radius: 50%;
	background: radial-gradient(closest-side, rgba(255, 196, 110, 0.5), rgba(255, 150, 60, 0.16) 55%, rgba(255, 150, 60, 0) 100%);
	mix-blend-mode: screen; animation: breathe 4.5s ease-in-out var(--d, 0s) infinite;
}
@keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

/* the cigar: a hot ember at the tip, its glow, and smoke curling up; the burning note flickers */
.ember {
	width: 1.3%; aspect-ratio: 1; border-radius: 50%;
	background: radial-gradient(closest-side, #fff7d0 0, #ffb347 35%, #ff5a14 65%, rgba(255, 70, 0, 0) 100%);
	mix-blend-mode: screen; animation: ember 1.7s steps(1, end) infinite;
}
.ember-glow {
	width: 7%; aspect-ratio: 1; border-radius: 50%;
	background: radial-gradient(closest-side, rgba(255, 120, 40, 0.55), rgba(255, 90, 20, 0.15) 50%, rgba(255, 90, 20, 0) 100%);
	mix-blend-mode: screen; animation: ember-glow 2.6s ease-in-out infinite;
}
@keyframes ember {
	0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
	18% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.85); }
	31% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
	47% { opacity: 0.8; transform: translate(-50%, -50%) scale(0.95); }
	63% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
	81% { opacity: 0.65; transform: translate(-50%, -50%) scale(0.9); }
}
@keyframes ember-glow { 0%, 100% { opacity: 0.5; } 40% { opacity: 1; } 70% { opacity: 0.7; } }
.flame {
	width: 10%; aspect-ratio: 0.8; border-radius: 50%;
	background: radial-gradient(closest-side, rgba(255, 210, 120, 0.6), rgba(255, 130, 40, 0.22) 50%, rgba(255, 110, 30, 0) 100%);
	mix-blend-mode: screen; animation: flame 0.9s ease-in-out infinite alternate;
}
@keyframes flame {
	0% { opacity: 0.6; transform: translate(-50%, -52%) scale(0.95, 1); }
	50% { opacity: 1; transform: translate(-49%, -55%) scale(1.04, 1.1); }
	100% { opacity: 0.75; transform: translate(-51%, -50%) scale(0.98, 0.96); }
}
.smoke {
	width: 2.6%; aspect-ratio: 1; border-radius: 50%; opacity: 0;
	background: radial-gradient(closest-side, rgba(225, 215, 200, 0.4), rgba(225, 215, 200, 0));
	filter: blur(3px); animation: smoke 7s linear var(--d, 0s) infinite;
}
@keyframes smoke {
	0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
	12% { opacity: 0.7; }
	100% { opacity: 0; transform: translate(10%, -650%) scale(3.2); }
}

/* now and then a sheen of light sweeps across the picture */
.sheen {
	position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
	background: linear-gradient(105deg, rgba(255, 230, 180, 0) 42%, rgba(255, 230, 180, 0.08) 47%, rgba(255, 244, 214, 0.2) 50%, rgba(255, 230, 180, 0.08) 53%, rgba(255, 230, 180, 0) 58%);
	background-size: 260% 100%; background-repeat: no-repeat;
	animation: sweep 9s ease-in-out 1.5s infinite;
}
@keyframes sweep { 0% { background-position: 130% 0; } 45%, 100% { background-position: -30% 0; } }

/* shade so the words read: the top left for the name, the bottom for the loading bar */
#shade {
	position: absolute; inset: 0; pointer-events: none;
	background:
		radial-gradient(ellipse 55% 45% at 0% 0%, rgba(20, 12, 8, 0.85), rgba(20, 12, 8, 0) 100%),
		linear-gradient(to top, rgba(20, 12, 8, 0.9), rgba(20, 12, 8, 0) 30%);
}
#brand { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); }
#brand h1 {
	margin: 0; font-family: var(--display); font-style: italic; font-weight: 800; line-height: 1;
	font-size: clamp(24px, 3.4vw, 50px); color: var(--mustard);
	text-shadow: 0 2px 0 #1c130d, 0 0 18px rgba(224, 169, 59, 0.35);
}
#brand p { margin: 6px 0 0 3px; font-size: clamp(11px, 1.3vw, 16px); letter-spacing: 0.12em; color: var(--cream); text-shadow: 0 1px 2px #000; }
#loader {
	position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
	display: flex; flex-direction: column; gap: 8px; max-width: min(34em, calc(100vw - 36px));
}
#loader p { margin: 0; line-height: 1.45; font-size: 14px; text-shadow: 0 1px 2px #000; }
#loader .small { font-size: 12px; opacity: 0.8; }
#bar { width: min(320px, 60vw); height: 8px; border: 1px solid var(--mustard); border-radius: 2px; background: rgba(28, 19, 13, 0.6); }
#fill { height: 100%; width: 0; background: var(--mustard); transition: width 0.2s; box-shadow: 0 0 8px rgba(224, 169, 59, 0.6); }
#notice { display: none; background: var(--panel); border: 1px solid var(--rust); padding: 10px 14px; border-radius: 4px; }
#turn { display: none; color: var(--mustard); }
@media (orientation: portrait) and (max-width: 900px) { #turn { display: block; } }
@media (prefers-reduced-motion: reduce) {
	#fill { transition: none; }
	.spark, .smoke, .sheen { animation: none; opacity: 0; }
	.glow, .ember, .ember-glow, .flame { animation: none; opacity: 0.85; }
}
</style>

// A new version can arrive while the page is open. The game engine can't be swapped while it runs
// (half-replaced, it stops answering taps), so the page reloads cleanly instead. The game is saved
// in this browser, so it carries on from the last save.
if (window.__idleTradingStarted) {
	location.reload();
	throw new Error("Loading the new version.");
}
window.__idleTradingStarted = true;

	// silent switch is on, as if it were a ringtone. Asking for "playback" makes it play like music

	// the engine waits for a small helper script (an audio worklet that reports how far a sound has
	// played). If that never loads on a phone, every game sound waits forever. So: wait at most 20
	// seconds (a busy start can take several), and if the helper isn't there, sounds start without it
	// (this game never asks where in a sound it is).

		var ctx = contexts[contexts.length - 1];

// its pieces back together. tools/build_web.py fills in PIECES.

	const realFetch = window.fetch.bind(window);

		if (!name) {
			return realFetch(input, init);
		}
		const parts = PIECES[name];
		let next = 0;
		let reader = null;
		const body = new ReadableStream({
			async pull(controller) {
				for (;;) {
					if (!reader) {
						if (next >= parts.length) { controller.close(); return; }
						const r = await realFetch(parts[next++]);

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.wasm":39514754,"index.pck":15699192},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine = new Engine(GODOT_CONFIG);
// Started once; if the page is handed a new version later, it reloads (see the top).
function bootGame() {
	if (window.__idleTradingRunning) {
		location.reload();
		return;
	}
	window.__idleTradingRunning = true;
	const status = document.getElementById("status");
	const fill = document.getElementById("fill");
	const notice = document.getElementById("notice");
	function fail(err) {
		console.error(err);
		notice.textContent = "The game could not start: " + (err && err.message ? err.message : String(err)) + ". Try reloading the page.";
		notice.style.display = "block";
	}
	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length !== 0) {
		fail(new Error("this browser is missing " + missing.join(", ")));
		return;
	}
	// Kaan's iPhone: the first start sometimes stopped part way and only a second start went in. If the
	// download makes no progress for a while, start again once, by itself (the files already loaded
	// are kept by the offline cache, so the second try is quick).
	var lastProgress = Date.now();
	var watchdog = setInterval(function () {
		if (Date.now() - lastProgress < 25000) return;
		clearInterval(watchdog);
		var tried = false;
		try { tried = sessionStorage.getItem("itc-retried") === "1"; sessionStorage.setItem("itc-retried", "1"); } catch (e) {}
		if (!tried) {
			location.reload();
		} else {
			fail(new Error("the download stopped. Check the connection, then close the game and open it again"));
		}
	}, 2000);
	engine.startGame({
		onProgress: function (current, total) {
			lastProgress = Date.now();
			if (current > 0 && total > 0) {
				fill.style.width = Math.min(100, (current / total) * 100) + "%";
			}
		},
	}).then(function () {
		clearInterval(watchdog);
		try { sessionStorage.removeItem("itc-retried"); } catch (e) {}
		status.remove();
		// the radio's recordings come after the start, one by one, in the background; the game plays
		// each from /tmp/radio once it is there (window.itcRadio: recording -> file)
		window.itcRadio = {};
		Object.keys(RADIO).reduce(function (chain, key) {
			return chain.then(function () {
				return fetch(RADIO[key]).then(function (r) { return r.ok ? r.arrayBuffer() : null; }).then(function (buf) {
					if (!buf) return;
					var path = "/tmp/radio/" + RADIO[key];
					engine.copyToFS(path, buf);
					window.itcRadio[key] = path;
				});
			});
		}, Promise.resolve()).catch(function (e) { console.warn("Radio music:", e); });
	}, function (err) { clearInterval(watchdog); fail(err); });
}
if (window.claude && window.claude.hot && window.claude.hot.ready) {
	window.claude.hot.ready(bootGame);
} else {
	bootGame();
}
</script>
